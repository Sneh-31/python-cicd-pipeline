name: Python CI Pipeline

permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application
        run: python -m compileall -q .
      - name: Check secret availability
        env:
          MY_TEST_SECRET: ${{ secrets.MY_TEST_SECRET }}
        run: |
          if [ -n "$MY_TEST_SECRET" ]; then
            echo "Secret is configured successfully!"
          else
            echo "Secret is missing!"
            exit 1
          fi        
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -v
      - name: Generate Test Report
        run: python -m pytest -v > test-report.txt
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: test-report.txt
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-cicd-app:v1 .          